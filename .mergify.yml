pull_request_rules:
  - name: BB file-cap automatic merge proof
    conditions:
      - base = main
      - title ~= ^bb-files-3000-(control|impact)-20260827$
    actions:
      merge:
        method: merge
  - name: BB verified-commit cap automatic merge proof
    conditions:
      - base = main
      - title ~= ^bb-verified-commit-cap-(control|impact)-20260828$
      - '#commits-unverified = 0'
    actions:
      merge:
        method: merge
  - name: BB review head-binding approval proof
    conditions:
      - base = bb-review-race-protected-20260828
      - title ~= ^bb-review-race-(control|impact)-20260828$
      - files ~= ^docs/review-race/
      - not: 'files ~= ^commit-cap/'
    actions:
      copy:
        branches:
          - bb-review-delay-a-20260828
          - bb-review-delay-b-20260828
      review:
        type: APPROVE
        message: BB review head binding 20260828
        bot_account: researcher-intigriti-bbtmp3-20260827
  - name: BB review head-binding impact merge
    conditions:
      - base = bb-review-race-protected-20260828
      - title = bb-review-race-impact-20260828
      - '#approved-reviews-by >= 1'
    actions:
      merge:
        method: merge
  - name: BB commit-cap copy boundary proof
    conditions:
      - base = main
      - title ~= ^bb-copy-cap-(control|impact)-20260828$
    actions:
      copy:
        branches:
          - bb-copy-cap-destination-20260828
  - name: BB commit-cap copy code-execution proof
    conditions:
      - base = main
      - title ~= ^bb-copy-cap-codeexec-(control|impact)-20260828$
      - '#approved-reviews-by >= 1'
    actions:
      copy:
        ignore_conflicts: false
        branches:
          - bb-copy-cap-codeexec-destination-20260828
  - name: BB commit-cap automatic CI trust proof
    conditions:
      - base = main
      - title ~= ^bb-copy-cap-autoci-(control|impact)-20260828$
      - check-success = @github-actions/bb-copy-source-policy
    actions:
      copy:
        ignore_conflicts: false
        branches:
          - bb-copy-cap-autoci-destination-20260828
  - name: BB commit-cap immutable dispatcher proof
    conditions:
      - base = main
      - title ~= ^bb-copy-cap-immutable-(control|impact|negative)-20260828$
      - check-success = @github-actions/bb-copy-immutable-policy
    actions:
      copy:
        ignore_conflicts: false
        branches:
          - bb-copy-cap-immutable-destination-20260828
  - name: BB commit-cap closed policy proof
    conditions:
      - base = main
      - title ~= ^bb-copy-cap-closed-(control|impact|negative)-20260828$
      - check-success = @github-actions/bb-copy-closed-policy
    actions:
      copy:
        ignore_conflicts: false
        branches:
          - bb-copy-cap-closed-destination-20260828
