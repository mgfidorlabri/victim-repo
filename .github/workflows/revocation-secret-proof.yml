name: revocation-secret-proof
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-preexisting-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Prove trusted push secret context
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          actual="$(printf %s "$MERGIFY_TOKEN" | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "11b8a2fd2c33bb4cd3596779d7d26ec4163e5ae976a5a5a42a68e36ac985ee79"
          echo 'FLAG{revoked-merge-read-target-secret-20260827}'
