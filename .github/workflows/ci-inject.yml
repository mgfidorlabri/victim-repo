name: ci-inject
on: push
permissions:
  id-token: write
  contents: read
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - run: echo  | base64 -d > j.xml
      - uses: Mergifyio/gha-mergify-ci@main
        with:
          report_path: j.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
