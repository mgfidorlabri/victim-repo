name: copy-command-secret-proof
on:
  push:
jobs:
  prove-secret-context:
    runs-on: ubuntu-latest
    steps:
      - name: Prove target repository secret context without disclosing the secret
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/application.json -w "%{http_code}" -H "Authorization: Bearer $MERGIFY_TOKEN" https://api.mergify.com/v1/application)
          test "$status" = "200"
          jq -r '"authenticated_application_id=" + .id' /tmp/application.json
